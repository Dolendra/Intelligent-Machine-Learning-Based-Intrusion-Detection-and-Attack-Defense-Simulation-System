<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Aegis IDS architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111a"/>
      <stop offset="100%" stop-color="#0c1a27"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)" rx="16"/>
  <text x="32" y="42" fill="#3ec7c2" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Aegis IDS  Architecture</text>

  <!-- UI -->
  <rect x="40" y="70" width="880" height="70" rx="12" fill="#122536" stroke="#3ec7c2" stroke-opacity="0.35"/>
  <text x="60" y="112" fill="#e7f0f5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">React UI  Dashboard · Detection · Simulation · Reports</text>

  <!-- arrow -->
  <path d="M480 140 v28" stroke="#8fa6b5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="40" y="175" width="880" height="60" rx="12" fill="#122536" stroke="#e4a54a" stroke-opacity="0.4"/>
  <text x="60" y="212" fill="#e7f0f5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">FastAPI  /predict · /explain · /risk · /recommendation · /simulation · /incidents</text>

  <!-- engines -->
  <rect x="40" y="265" width="280" height="110" rx="12" fill="#122536" stroke="#3ec7c2" stroke-opacity="0.3"/>
  <text x="60" y="300" fill="#3ec7c2" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ML Engine</text>
  <text x="60" y="328" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Preprocess · Features</text>
  <text x="60" y="350" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Binary + Multiclass</text>

  <rect x="340" y="265" width="280" height="110" rx="12" fill="#122536" stroke="#e4a54a" stroke-opacity="0.35"/>
  <text x="360" y="300" fill="#e4a54a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Security Engine</text>
  <text x="360" y="328" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">SHAP / LIME · Risk</text>
  <text x="360" y="350" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Recommendations</text>

  <rect x="640" y="265" width="280" height="110" rx="12" fill="#122536" stroke="#5ecf8a" stroke-opacity="0.35"/>
  <text x="660" y="300" fill="#5ecf8a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Simulation</text>
  <text x="660" y="328" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Topology · Attack</text>
  <text x="660" y="350" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="14">Defense · Recover</text>

  <text x="32" y="405" fill="#8fa6b5" font-family="Segoe UI, Arial, sans-serif" font-size="12">Data: CICIDS2017 · trained models · SQLite incidents</text>
</svg>
