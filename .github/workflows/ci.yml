name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (no raw CICIDS required)
        run: |
          python -m pytest tests/test_security_simulation.py tests/test_api.py -q --tb=short

      - name: Smoke modules import
        run: |
          python -c "from security.risk.engine import compute_risk; from simulation.engine.core import SimulationEngine; print('ok')"
