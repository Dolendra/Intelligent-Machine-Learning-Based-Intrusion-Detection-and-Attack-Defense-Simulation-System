name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (no raw CICIDS required)
        env:
          MPLBACKEND: Agg
          DISABLE_RATE_LIMIT: "true"
        run: |
          python -m pytest tests -q --tb=short

      - name: Smoke modules import
        run: |
          python -c "from security.risk.engine import compute_risk; from security.rules import evaluate_rules; from security.correlation import escalate_severity; from simulation.engine.core import SimulationEngine; print('ok')"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, typecheck, build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run typecheck
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build
