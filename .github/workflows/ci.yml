name: CI

on:
  push:
    branches: [main, stage2/productionization]
  pull_request:
    branches: [main, stage2/productionization]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (no raw CICIDS required)
        env:
          MPLBACKEND: Agg
          DISABLE_RATE_LIMIT: "true"
        run: |
          python -m pytest tests -q --tb=short

      - name: Smoke modules import
        run: |
          python -c "from security.risk.engine import compute_risk; from security.rules import evaluate_rules; from security.correlation import escalate_severity; from simulation.engine.core import SimulationEngine; print('ok')"

  stage2-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage-2 phase + ingestion tests
        env:
          MPLBACKEND: Agg
          DISABLE_RATE_LIMIT: "true"
        run: |
          python -m pytest \
            tests/test_ingestion_stage2.py \
            tests/test_ingestion_queue.py \
            tests/test_phase_c_security.py \
            tests/test_phase_d_hardening.py \
            tests/test_phase_e_observability.py \
            -q --tb=short

      - name: Stage-2 import smoke (ingestion + metrics)
        run: |
          python -c "from ingestion.queue import ingest_queue; from backend.middleware.metrics_mw import process_metrics; print('stage2 ok', process_metrics.snapshot()['scope'])"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, typecheck, build
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run typecheck
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build
