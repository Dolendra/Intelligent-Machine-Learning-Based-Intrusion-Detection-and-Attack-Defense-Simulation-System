services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      # R-06/R-09: loopback only. The API is reached through the frontend (nginx) or locally.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./database:/app/database
    environment:
      DEMO_MODE: "true"
      MPLBACKEND: Agg
      # R-05/R-06: the container runs as production with authentication on. Compose reads these
      # from the project .env (git-ignored); startup fails fast if the secret is missing.
      AEGIS_ENV: production
      AEGIS_AUTH_ENABLED: "true"
      # R-17: X-Forwarded-For is trusted only from the compose network (nginx); the API port
      # itself is bound to 127.0.0.1 above.
      AEGIS_TRUSTED_PROXIES: "172.16.0.0/12"
      AEGIS_AUTH_SECRET: ${AEGIS_AUTH_SECRET:?set AEGIS_AUTH_SECRET (>= 32 chars) in .env}
      AEGIS_SEED_PASSWORD_ADMIN: ${AEGIS_SEED_PASSWORD_ADMIN:-}
      AEGIS_SEED_PASSWORD_RESPONDER: ${AEGIS_SEED_PASSWORD_RESPONDER:-}
      AEGIS_SEED_PASSWORD_ANALYST: ${AEGIS_SEED_PASSWORD_ANALYST:-}
      AEGIS_SEED_PASSWORD_VIEWER: ${AEGIS_SEED_PASSWORD_VIEWER:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
