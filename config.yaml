# Intelligent ML-Based IDS Platform — central configuration
project:
  name: "Intelligent IDS Platform"
  version: "1.1.0"

data:
  # Primary ML-ready CICIDS2017 flows (use MachineLearningCVE, not TrafficLabelling)
  raw_dir: "MachineLearningCVE"
  processed_dir: "data/processed"
  # Fraction of rows to sample for faster iteration (1.0 = full dataset)
  sample_frac: 1.0
  random_state: 42
  test_size: 0.2
  val_size: 0.1
  # Drop attack families with fewer than this many rows (stabilizes multiclass metrics)
  min_class_count: 50
  # Drop identifier-like / leakage-prone columns if present
  drop_columns:
    - "Flow ID"
    - "Source IP"
    - "Destination IP"
    - "Timestamp"
    - "Source Port"

features:
  # Max features after selection (SelectKBest / importance)
  max_features: 40
  scale: true
  # Fit separate SelectKBest for binary vs multiclass (shared scaler)
  dual_selectors: true

models:
  output_dir: "models/trained_models"
  model_version: "1.1.0"
  binary_threshold: 0.85
  # Certainty bands (overridden by threshold_operating_point.json when present)
  uncertainty_lower: 0.10
  uncertainty_upper: 0.95
  # Prefer binary_calibrated.joblib when true and the artifact exists
  # Kept false: sample isotonic calibration worsened Brier and cut recall (see docs/experiments/)
  use_calibrated_binary: false
  # Multi-objective binary selection weights (project-justified)
  selection_weights:
    recall: 0.30
    f1: 0.25
    pr_auc: 0.20
    fpr: 0.15
    latency: 0.10
  binary:
    algorithms: ["logistic_regression", "decision_tree", "random_forest", "xgboost"]
  multiclass:
    algorithms: ["random_forest", "xgboost"]

risk:
  # Configurable severity bands (documented; not universal standards)
  bands:
    low: [0, 30]
    medium: [31, 60]
    high: [61, 80]
    critical: [81, 100]
  # Blend weights (project convention — must sum conceptually to ~1.0)
  weights:
    attack_base: 0.50
    confidence: 0.25
    intensity: 0.15
    asset_criticality: 0.10
  # Base severity by attack family (0–100 contribution)
  attack_base:
    BENIGN: 0
    DoS: 70
    DDoS: 90
    PortScan: 45
    BruteForce: 65
    WebAttack: 75
    Bot: 80
    Infiltration: 85
    Heartbleed: 95
    Other: 50

xai:
  default_method: shap
  top_k: 10

research:
  experiment_sample_rows: 60000
  hpo_n_iter: 8
  external_dataset_dir: "CSE-CIC-IDS2018"

incident:
  statuses:
    - Detected
    - Triaged
    - Investigating
    - MitigationRecommended
    - DefenseApplied
    - Simulating
    - Monitoring
    - Resolved
    - FalsePositive
  # Same attack_type (+ source_ref when present) within window updates existing incident
  dedup_window_minutes: 5
  # Related detections (same source / kill-chain adjacency) share a campaign_id
  campaign_window_minutes: 30

simulation:
  default_topology: "enterprise_simple"
  tick_ms: 800
  # Assumed defense efficacy by attack family (visualization assumptions)
  defense_effectiveness:
    DDoS: 0.82
    DoS: 0.78
    PortScan: 0.85
    BruteForce: 0.88
    WebAttack: 0.90
    Bot: 0.92

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:80"
    - "http://127.0.0.1:80"
  # Set true (or AEGIS_CORS_STRICT=true) to restrict methods/headers for production
  cors_strict: false
  # P5: rate limiting ON by default for security-sensitive paths (CI sets DISABLE_RATE_LIMIT=true)
  rate_limit:
    enabled: true
    requests_per_window: 120
    window_seconds: 60
    paths:
      - "/api/auth/login"
      - "/api/predict"
      - "/api/ingest"
      - "/api/explain"
      - "/api/recommendation"
      - "/api/response"
      - "/api/simulation"
    path_limits:
      "/api/auth/login":
        requests_per_window: 10
        window_seconds: 60
  request_limits:
    enabled: true
    max_json_bytes: 1048576
    max_csv_bytes: 10485760
    max_pcap_bytes: 26214400
    max_multipart_bytes: 31457280
    max_body_bytes: 2097152
  security_headers:
    enabled: true
  auth:
    enabled: false
    # Prefer env AEGIS_API_KEY / AEGIS_AUTH_SECRET when enabling
    api_key: ""
    api_key_role: admin
    # P4: do not trust client X-Aegis-Role unless explicitly enabled for legacy demos
    allow_role_header: false
    header: "X-API-Key"
    role_header: "X-Aegis-Role"
    default_role: "analyst"
    enforce_rbac: true

# Stage-2 Phase C / P6: durable DB. Default empty → local SQLite file.
# Example: postgresql+psycopg://aegis:aegis@localhost:5432/aegis
database:
  url: ""
  dialect_note: "sqlite default for research baseline; set IDS_DB_URL for PostgreSQL"
  # Retention rationale: audit/incidents are security evidence (long);
  # simulations are operational (shorter); raw PCAP is filesystem TTL (short).
  retention:
    audit_days: 365
    incidents_days: 365
    alerts_days: 365
    simulations_days: 90
    raw_pcap_hours: 24
    temp_files_hours: 1

# P7 observability — structured logs + in-process metrics (not Prometheus/OTel)
observability:
  environment: development
  log_level: INFO
  log_retention_days: 14  # process/container log driver responsibility
  alerts:
    queue_depth_warn: 25
    queue_depth_critical: 80
    error_5xx_rate_warn: 0.05
    min_requests_for_error_rate: 20
    auth_failures_warn: 20
    rate_limit_hits_warn: 50
    pcap_extract_failures_warn: 5
    response_verify_failures_warn: 3
